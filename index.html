* {

body {

h1,

button,

button {

#root {

.center {

.card {

.mark {

.brand {

}

.sub {

}

.tabs {

.tabs button {

}

.tabs .active {

.field {

.field label {

.voice-btn {

/* =========================
   VOICE ASSISTANT WIDGET
========================= */

.voice-fab {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: var(--navy);
  color: var(--brass);
  border: none;
  font-size: 30px;
  display: grid;
  place-items: center;
  box-shadow: 0 6px 18px rgba(28,37,65,.35);
  z-index: 30;
  transition: transform .15s ease;
}

.voice-fab:active {
  transform: scale(0.94);
}

.voice-fab.listening {
  background: var(--danger);
  color: #fff;
  animation: voicePulse 1.1s infinite;
}

.voice-fab.processing {
  background: var(--pending);
  color: #fff;
}

.voice-fab.speaking {
  background: var(--progress);
  color: #fff;
}

.voice-fab.error {
  background: var(--danger);
  color: #fff;
}

@keyframes voicePulse {
  0% { box-shadow: 0 0 0 0 rgba(179,70,44,.45); }
  70% { box-shadow: 0 0 0 16px rgba(179,70,44,0); }
  100% { box-shadow: 0 0 0 0 rgba(179,70,44,0); }
}

.voice-warning {

.voice-shortcuts {

@media(max-width:520px) {

async function get(k) {
  const r = await fetch(
    '/api/data?key=' + encodeURIComponent(k)
  );

  if (!r.ok) {
    throw new Error('API fetch failed');
  }

  const payload = await r.json();

  return payload.value ?? null;
}


async function set(k, v) {
  const r = await fetch(
    '/api/data?key=' + encodeURIComponent(k),
    {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        value: v
      })
    }
  );

  if (!r.ok) {
    throw new Error('API save failed');
  }

  return true;
}

========================= */

function shell(inner) {

  const role =
    state.screen === 'admin'
      ? T.admin
      : state.screen === 'staff'
        ? T.staff
        : T.customer;

  const name =
    state.user?.name ||
    state.customer?.name ||
    state.phone ||
    '';

  return `

    <div class="topbar">

      <div class="logo">
        ${logo()}
      </div>

      <div class="who">

        <div>
          <span class="role">${role}</span>
          · ${name}
        </div>

        <button
          class="logout"
          id="logout">
          లాగ్ అవుట్
        </button>

      </div>

    </div>

    <main>
      ${inner}
    </main>

    ${voiceWidget()}

  `;
}


function content() {

  if (state.screen === 'admin') {
    return admin();
  }

  if (state.screen === 'staff') {
    return staff();
  }

  return customerView();
}


/* =========================
   RENDER
========================= */

function render() {

  const root =
    document.getElementById('root');

  if (state.screen === 'login') {

    root.innerHTML = login();

  } else {

    root.innerHTML =
      shell(content()) +
      modalHtml();

  }

  attach();
}


/* =========================
   MODALS
========================= */

function modalHtml() {

  if (state.modal === true) {
    return staffModal();
  }

  if (state.modal === 'customer') {
    return customerModal();
  }

  if (state.modal === 'editCustomer') {
    return customerModal(true);
  }

  if (state.modal === 'order') {
    return orderModal();
  }

  return '';
}

  const profile = `

        class="grid2"

  return `

    ${actionRow}

  `;

/* =========================
   ORDER CARD
========================= */

function orderCard(o, edit) {

  const i = step(o.status);

  const photos =
    (o.photos || [])
      .map(
        (x, index) => `

          <div
            class="photo"
            style="position:relative">

            <img src="${x}">

            ${
              edit && state.screen === 'staff'
                ? `
                  <button
                    type="button"
                    class="deletePhoto"
                    data-delete-order-photo="${index}"
                    data-order-id="${o.id}">
                    ×
                  </button>
                `
                : ''
            }

          </div>

        `
      )
      .join('');

  const remaining =
    Math.max(
      0,
      (o.total || 0) -
      ((o.advancePaid || o.paid || 0))
    );

  const counts =
    o.garments

      ? Object.entries(o.garments)
          .filter(([, count]) => count > 0)
          .map(
            ([name, count]) =>
              `${name[0].toUpperCase() + name.slice(1)} × ${count}`
          )
          .join(', ')

      : `${o.type || T.genericCloth} × ${o.quantity || 1}`;

  const takenBy =
    o.takenBy || 'Not recorded';

  return `

    <div class="order">

      <div class="orderhead">

        <div>

          <div class="orderid">
            ${esc(o.id)}
            ·
            ${esc(counts)}
          </div>

          <div class="date">
            ${fmt(o.createdAt)}
            ·
            ${T.dueDate}
            ${esc(o.dueDate || '—')}
          </div>

          <div class="secondary">
            ${T.takenBy}:
            ${esc(takenBy)}
          </div>

        </div>

        <span class="pill ${o.status}">
          ${statusLabel(o.status)}
        </span>

      </div>


      <div class="steps">

        ${[0,1,2,3]
          .map(
            (n, k) =>
              `
                ${
                  k
                    ? `
                      <div
                        class="line ${i >= k ? 'done' : ''}">
                      </div>
                    `
                    : ''
                }

                <div
                  class="dot ${i >= n ? 'done' : ''}">
                </div>
              `
          )
          .join('')}

      </div>


      <div class="labels">

        <span>${T.statusPending}</span>
        <span>${T.statusInProgress}</span>
        <span>${T.statusCompleted}</span>
        <span>${T.statusDelivered}</span>

      </div>


      <div
        class="grid2"
        style="margin-top:12px">

        <div>

          <b>${T.measurements}</b>

          <div class="secondary">
            ${esc(o.measurements || T.optional)}
          </div>

        </div>

        <div>

          <b>${T.notes}</b>

          <div class="secondary">
            ${esc(o.notes || '—')}
          </div>

        </div>

      </div>


      ${
        photos
          ? `
            <div class="photos">
              ${photos}
            </div>
          `
          : ''
      }


      <div class="payment">

        <div class="payrow">

          <span>${T.advancePaid}</span>

          <strong>
            ₹${o.advancePaid || o.paid || 0}
          </strong>

        </div>

        <div class="payrow">

          <span>${T.total}</span>

          <strong>
            ₹${o.total || 0}
          </strong>

        </div>

        <div class="payrow remaining">

          <span>${T.remaining}</span>

          <strong>
            ₹${remaining}
          </strong>

        </div>

      </div>


      ${
        edit

          ? `
            <div
              style="
                display:flex;
                gap:8px;
                margin-top:10px">

              <select
                class="search"
                data-status="${o.id}">

                <option
                  value="pending"
                  ${o.status === 'pending' ? 'selected' : ''}>
                  ${T.statusPending}
                </option>

                <option
                  value="in_progress"
                  ${o.status === 'in_progress' ? 'selected' : ''}>
                  ${T.statusInProgress}
                </option>

                <option
                  value="completed"
                  ${o.status === 'completed' ? 'selected' : ''}>
                  ${T.statusCompleted}
                </option>

                <option
                  value="delivered"
                  ${o.status === 'delivered' ? 'selected' : ''}>
                  ${T.statusDelivered}
                </option>

              </select>

              <button
                class="btn primary"
                data-save-status="${o.id}">
                Update
              </button>

            </div>
          `
          : ''
      }

    </div>

  `;
}

function esc(x) {

  return String(x ?? '')
    .replace(
      /[&<>"']/g,
      m =>
        ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m])
    );
}

function bindTempPhotoDeletes() {

          );

        );

async function handlePhotoSelection(event) {

  const files =
    [...event.target.files]
      .slice(0, 5);

  state.tempOrderPhotos = [];

  for (const f of files) {

    state.tempOrderPhotos.push({
      id: Date.now() + Math.random(),
      src: await fileToDataUrl(f),
      name: f.name
    });

  }

  renderTempPhotos();
  bindTempPhotoDeletes();
}


function fileToDataUrl(file) {

  return new Promise(
    (resolve, reject) => {

      const r =
        new FileReader();

      r.onload = () =>
        resolve(r.result);

      r.onerror = reject;

      r.readAsDataURL(file);

    }
  );
}


/* =========================
   VOICE
========================= */

function speechVoices() {

  try {

    return (
      window.speechSynthesis
        ?.getVoices?.() || []
    );

  } catch (e) {

    return [];

  }
}


function chooseVoice() {

  const voices =
    speechVoices();

  const telugu =
    voices.find(
      v =>
        /te|telugu/i.test(
          v.lang || ''
        ) ||
        /te/i.test(
          v.name || ''
        )
    ) || null;

  const india =
    voices.find(
      v =>
        /in/i.test(
          v.lang || ''
        )
    ) || null;

  return (
    telugu ||
    india ||
    voices[0] ||
    null
  );
}


function speak(text) {

  try {

    if (!('speechSynthesis' in window)) {
      return;
    }

    const voices =
      speechVoices();

    const voice =
      chooseVoice();

    window.speechSynthesis.cancel();

    const msg =
      new SpeechSynthesisUtterance(text);

    msg.lang = 'te-IN';
    msg.rate = 0.92;
    msg.pitch = 1.1;
    msg.volume = 1;

    if (voice) {
      msg.voice = voice;
    }

    if (!voices.length) {

      window.speechSynthesis.onvoiceschanged =
        () => {

          const nextVoice =
            chooseVoice();

          if (nextVoice) {
            msg.voice = nextVoice;
          }

          window.speechSynthesis.speak(msg);

        };

    }

    window.speechSynthesis.speak(msg);

  } catch (e) {

    // Ignore audio errors.

  }
}

    inputId,

    doneText = clean => `✅ ${clean}`
  } = config || {};

  const input =
    document.getElementById(inputId);

  const status =
    statusId
      ? document.getElementById(statusId)
      : null;

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    if (status) {
      status.textContent = T.noVoice;
    }

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = lang;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  if (status) {

    status.classList.add('listening');
    status.textContent = listeningText;

  }

  recognition.start();

  recognition.onresult =
    event => {

      const transcript =
        event.results?.[0]?.[0]?.transcript ||
        '';

      let clean =
        transcript
          .trim()
          .replace(/\s+/g, ' ');

      if (stripSpaces) {
        clean = clean.replace(/\s+/g, '');

      if (input && clean) {
        input.value = clean;

        status.classList.remove(
          'listening'

            ? doneText(clean)

    () => {

        status.classList.remove(
          'listening'

    () => {

      if (status) {

          'listening'
        );
      }

    };

/* ---------- TELUGU NUMBER WORDS ---------- */

const TELUGU_DIGIT_WORDS = {
  'సున్నా': 0, 'జీరో': 0,
  'ఒకటి': 1, 'ఒక': 1,
  'రెండు': 2,
  'మూడు': 3,
  'నాలుగు': 4,
  'ఐదు': 5,
  'ఆరు': 6,
  'ఏడు': 7,
  'ఎనిమిది': 8,
  'తొమ్మిది': 9
};

const TELUGU_TENS_WORDS = {
  'పది': 10, 'ఇరవై': 20, 'ముప్పై': 30, 'నలభై': 40, 'యాభై': 50,
  'అరవై': 60, 'డెబ్బై': 70, 'ఎనభై': 80, 'తొంభై': 90
};

const TELUGU_SCALE_WORDS = {
  'వంద': 100, 'వందలు': 100, 'వందల': 100,
  'వెయ్యి': 1000, 'వేలు': 1000, 'వేల': 1000,
  'లక్ష': 100000, 'లక్షలు': 100000, 'లక్షల': 100000
};

const TELUGU_UNIT_NAMES = ['', 'ఒకటి', 'రెండు', 'మూడు', 'నాలుగు', 'ఐదు', 'ఆరు', 'ఏడు', 'ఎనిమిది', 'తొమ్మిది'];
const TELUGU_TENS_NAMES = ['', 'పది', 'ఇరవై', 'ముప్పై', 'నలభై', 'యాభై', 'అరవై', 'డెబ్బై', 'ఎనభై', 'తొంభై'];

function numberToTeluguWords(n) {

  n = Math.round(Number(n) || 0);

  if (n === 0) {
    return 'సున్నా';
  }

  if (n < 0) {
    return 'మైనస్ ' + numberToTeluguWords(-n);
  }

  const lakhs = Math.floor(n / 100000);
  n %= 100000;

  const thousands = Math.floor(n / 1000);
  n %= 1000;

  const hundreds = Math.floor(n / 100);
  n %= 100;

  const tens = Math.floor(n / 10);
  const units = n % 10;

  const parts = [];

  if (lakhs) {
    parts.push(`${numberToTeluguWords(lakhs)} ${(thousands || hundreds || tens || units) ? 'లక్షల' : 'లక్షలు'}`);
  }

  if (thousands) {
    parts.push(`${TELUGU_UNIT_NAMES[thousands] || thousands} ${(hundreds || tens || units) ? 'వేల' : 'వేలు'}`);
  }

  if (hundreds) {
    parts.push(`${TELUGU_UNIT_NAMES[hundreds]} ${(tens || units) ? 'వందల' : 'వందలు'}`);
  }

  if (tens && units) {
    parts.push(`${TELUGU_TENS_NAMES[tens]} ${TELUGU_UNIT_NAMES[units]}`);
  } else if (tens) {
    parts.push(TELUGU_TENS_NAMES[tens]);
  } else if (units) {
    parts.push(TELUGU_UNIT_NAMES[units]);
  }

  return parts.join(' ').trim();
}

function parseSpokenAmount(text) {

  const raw = String(text || '').trim();

  if (!raw) {
    return null;
  }

  const compact = raw.replace(/[₹,\s]/g, '');

  if (/^\d+$/.test(compact)) {
    return Number(compact);
  }

  const digitMatch = raw.match(/\d+/);

  const tokens = raw.split(/\s+/).filter(Boolean);

  let matchedAny = false;
  let total = 0;
  let current = 0;

  for (const tok of tokens) {

    if (/^\d+$/.test(tok)) {
      current += Number(tok);
      matchedAny = true;
      continue;
    }

    if (tok in TELUGU_DIGIT_WORDS) {
      current += TELUGU_DIGIT_WORDS[tok];
      matchedAny = true;
      continue;
    }

    if (tok in TELUGU_TENS_WORDS) {
      current += TELUGU_TENS_WORDS[tok];
      matchedAny = true;
      continue;
    }

    if (tok in TELUGU_SCALE_WORDS) {

      const scale = TELUGU_SCALE_WORDS[tok];

      current = (current || 1) * scale;

      if (scale >= 1000) {
        total += current;
        current = 0;
      }

      matchedAny = true;
      continue;
    }
  }

  total += current;

  if (matchedAny) {
    return total;
  }

  if (digitMatch) {
    return Number(digitMatch[0]);
  }

  return null;
}

function normalizePhoneNumber(text) {

  const raw = String(text || '').trim();

  const digitsOnly = raw.replace(/\D/g, '');

  if (digitsOnly.length === 10) {
    return digitsOnly;
  }

  const tokens = raw.split(/\s+/).filter(Boolean);

  let digits = '';

  for (const tok of tokens) {

    if (/^\d$/.test(tok)) {
      digits += tok;
      continue;
    }

    if (tok in TELUGU_DIGIT_WORDS) {
      digits += String(TELUGU_DIGIT_WORDS[tok]);
      continue;
    }
  }

  if (digits.length === 10) {
    return digits;
  }

  return null;
}

function parseSpokenDate(text) {

  const t = String(text || '').trim();

  if (!t) {
    return null;
  }

  const today = new Date();

  if (/రేపు|repu/i.test(t)) {
    const d = new Date(today);
    d.setDate(d.getDate() + 1);
    return d.toISOString().slice(0, 10);
  }

  if (/ఎల్లుండి/i.test(t)) {
    const d = new Date(today);
    d.setDate(d.getDate() + 2);
    return d.toISOString().slice(0, 10);
  }

  if (/ఈరోజు|today/i.test(t)) {
    return today.toISOString().slice(0, 10);
  }

  const monthNames = {
    'జనవరి': 0, 'ఫిబ్రవరి': 1, 'మార్చి': 2, 'ఏప్రిల్': 3, 'మే': 4, 'జూన్': 5,
    'జూలై': 6, 'ఆగస్టు': 7, 'సెప్టెంబర్': 8, 'అక్టోబర్': 9, 'నవంబర్': 10, 'డిసెంబర్': 11
  };

  let month = today.getMonth();
  let year = today.getFullYear();
  let matchedMonth = false;

  for (const name in monthNames) {

    if (t.includes(name)) {
      month = monthNames[name];
      matchedMonth = true;
      break;
    }
  }

  const dayMatch = t.match(/(\d{1,2})/);

  if (dayMatch) {

    const day = Number(dayMatch[1]);

    if (day >= 1 && day <= 31) {

      let d = new Date(year, month, day);

      if (!matchedMonth && d < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
        d = new Date(year, month + 1, day);
      }

      return d.toISOString().slice(0, 10);
    }
  }

  return null;
}


/* ---------- CORE VOICE PLUMBING ---------- */

function speakTelugu(text, after) {

  state.voice.response = text;
  state.voice.status = 'speaking';
  render();

  try {

    if (!('speechSynthesis' in window)) {
      state.voice.status = 'idle';
      render();
      if (after) after();
      return;
    }

    window.speechSynthesis.cancel();

    const voice = chooseVoice();

    const msg = new SpeechSynthesisUtterance(text);

    msg.lang = 'te-IN';
    msg.rate = 0.95;
    msg.pitch = 1.05;
    msg.volume = 1;

    if (voice) {
      msg.voice = voice;
    }

    const finish = () => {
      if (state.voice.status === 'speaking') {
        state.voice.status = 'idle';
      }
      render();
      if (after) after();
    };

    msg.onend = finish;
    msg.onerror = finish;

    window.speechSynthesis.speak(msg);

  } catch (e) {

    state.voice.status = 'idle';
    render();
    if (after) after();
  }
}

function startVoiceRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    state.voice.status = 'error';
    state.voice.response = 'ఈ బ్రౌజర్‌లో వాయిస్ సౌకర్యం అందుబాటులో లేదు. Chrome ఉపయోగించండి.';
    render();
    return;
  }

  try {
    window.speechSynthesis?.cancel();
  } catch (e) {
    // ignore
  }

  let recognition;

  try {
    recognition = new SpeechRecognition();
  } catch (e) {
    state.voice.status = 'error';
    state.voice.response = 'మైక్రోఫోన్ ప్రారంభించలేకపోయాము.';
    render();
    return;
  }

  voiceRecognition = recognition;

  recognition.lang = 'te-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  state.voice.status = 'listening';
  state.voice.transcript = '';
  render();

  let handled = false;

  recognition.onresult = event => {

    handled = true;

    const transcript =
      event.results?.[0]?.[0]?.transcript || '';

    const clean = transcript.trim();

    state.voice.transcript = clean;
    state.voice.status = 'processing';
    render();

    setTimeout(() => handleVoiceTranscript(clean), 100);
  };

  recognition.onerror = () => {

    handled = true;

    state.voice.status = 'error';
    render();

    speakTelugu('అర్థం కాలేదు. మళ్ళీ ప్రయత్నించండి.');
  };

  recognition.onend = () => {

    if (!handled && state.voice.status === 'listening') {
      state.voice.status = 'idle';
      render();
    }
  };

  try {
    recognition.start();
  } catch (e) {

    state.voice.status = 'error';
    state.voice.response = 'మైక్రోఫోన్ ప్రారంభించలేకపోయాము.';
    render();
  }
}

function stopVoiceRecognition() {

  try {
    voiceRecognition?.stop();
  } catch (e) {
    // ignore
  }

  try {
    window.speechSynthesis?.cancel();
  } catch (e) {
    // ignore
  }

  if (state.voice.status === 'listening' || state.voice.status === 'speaking') {
    state.voice.status = 'idle';
  }
}

function toggleVoicePanel() {

  state.voice.panelOpen = !state.voice.panelOpen;

  if (!state.voice.panelOpen) {

    stopVoiceRecognition();

    state.voice.status = 'idle';
    state.voice.flow = null;
    state.voice.transcript = '';
    state.voice.response = '';
  }

  render();
}

function isAffirmative(text) {
  return /(అవును|సరే|avunu|sare|^yes$|^ok$)/i.test(String(text || '').trim());
}

function isNegative(text) {
  return /(వద్దు|కాదు|రద్దు|^no$|cancel)/i.test(String(text || '').trim());
}

async function handleVoiceTranscript(text) {

  if (!text) {

    state.voice.status = 'error';
    render();

    speakTelugu('ఏమీ వినిపించలేదు. మళ్ళీ ప్రయత్నించండి.');

    return;
  }

  if (state.voice.flow) {
    await advanceVoiceFlow(text);
    return;
  }

  const intent = parseVoiceIntent(text);

  await dispatchVoiceIntent(intent);
}


/* ---------- INTENT PARSER ---------- */

const VOICE_NAME_STOPWORDS = [
  'గారి', 'గారిని', 'గారు', 'గారికి', 'కస్టమర్', 'కస్టమర్ని', 'ఆర్డర్', 'ఆర్డర్లు', 'ఆర్డర్‌లు',
  'చూపించు', 'వెతుకు', 'వెతకు', 'చూడాలి', 'చూడాలంటే', 'తీసుకో', 'తీసుకోండి', 'జోడించు', 'కొత్త',
  'పాత', 'పాతవి', 'పెండింగ్‌లో', 'పెట్టు', 'పూర్తయింది', 'ఎంత', 'ఎన్ని', 'ఎప్పుడు', 'ఇవ్వాలి',
  'డబ్బు', 'చెల్లించారు', 'మిగిలింది', 'ధర', 'కోసం', 'వివరాలు', 'ఇచ్చారు', 'యొక్క', 'ki', 'కి', 'ను', 'ని', 'లో'
];

function extractCustomerNameFromText(text) {

  let words = String(text || '').split(/\s+/).filter(Boolean);

  words = words.filter(
    w => !VOICE_NAME_STOPWORDS.some(sw => w === sw || w.includes(sw))
  );

  const name = words.join(' ').trim();

  return name || null;
}

function parseVoiceIntent(rawText) {

  const text = String(rawText || '').trim();

  if (/(కొత్త కస్టమర్|కస్టమర్.*జోడించు|add customer|new customer)/i.test(text)) {
    return { type: 'ADD_CUSTOMER' };
  }

  if (/(కొత్త ఆర్డర్|ఆర్డర్ తీసుకో|షర్ట్ ఆర్డర్|ప్యాంట్ ఆర్డర్|new order|create order)/i.test(text)) {
    return { type: 'CREATE_ORDER', name: extractCustomerNameFromText(text) };
  }

  if (/(డెలివర్|delivered|ఇచ్చేసాను|డెలివరీ చేశాను)/i.test(text)) {
    return { type: 'UPDATE_ORDER_STATUS', status: 'delivered' };
  }

  if (/(పూర్తయింది|completed|complete అయింది)/i.test(text)) {
    return { type: 'UPDATE_ORDER_STATUS', status: 'completed' };
  }

  if (/(పని మొదలైంది|ప్రోగ్రెస్‌లో|in progress)/i.test(text)) {
    return { type: 'UPDATE_ORDER_STATUS', status: 'in_progress' };
  }

  if (/(పెండింగ్‌లో పెట్టు|పెండింగ్ చేయి|mark pending)/i.test(text)) {
    return { type: 'UPDATE_ORDER_STATUS', status: 'pending' };
  }

  if (/(ఈరోజు ఆర్డర్లు|today.*order)/i.test(text)) {
    return { type: 'VIEW_DASHBOARD', which: 'today_orders' };
  }

  if (/(పెండింగ్ ఆర్డర్లు|pending order)/i.test(text)) {
    return { type: 'VIEW_DASHBOARD', which: 'pending_orders' };
  }

  if (/(ఈరోజు డెలివరీలు|today.*deliver)/i.test(text)) {
    return { type: 'VIEW_DASHBOARD', which: 'today_deliveries' };
  }

  if (/(ఎంత డబ్బు తీసుకున్నాం|ఎంత చెల్లించారు|how much paid)/i.test(text)) {
    return { type: 'READ_PAYMENT' };
  }

  if (/(ఇంకా ఎంత|మిగిలింది|remaining|balance)/i.test(text)) {
    return { type: 'READ_BALANCE' };
  }

  if (/(ఎప్పుడు ఇవ్వాలి|due date)/i.test(text)) {
    return { type: 'READ_DUE_DATE' };
  }

  if (/(ఎవరు తీసుకున్నారు|who took)/i.test(text)) {
    return { type: 'READ_TAKEN_BY' };
  }

  if (/(ఈ ఆర్డర్ ఎంత|order.*total|ఆర్డర్ వివరాలు|order details)/i.test(text)) {
    return { type: 'VIEW_ORDER' };
  }

  if (/(పాత ఆర్డర్లు|ఎన్ని ఆర్డర్లు|order history)/i.test(text)) {
    return { type: 'VIEW_CUSTOMER_HISTORY', name: extractCustomerNameFromText(text) };
  }

  if (/(వెతుకు|వెతకు|చూపించు|చూడాలి|search|show)/i.test(text)) {
    return { type: 'SEARCH_CUSTOMER', name: extractCustomerNameFromText(text) };
  }

  return { type: 'UNKNOWN', text };
}

async function dispatchVoiceIntent(intent) {

  switch (intent.type) {

    case 'SEARCH_CUSTOMER':
      return voiceSearchCustomer(intent.name);

    case 'ADD_CUSTOMER':
      return startVoiceFlow('add_customer');

    case 'CREATE_ORDER':
      return startVoiceFlow('create_order', { name: intent.name });

    case 'UPDATE_ORDER_STATUS':
      return voiceUpdateOrderStatus(intent.status);

    case 'VIEW_ORDER':
      return voiceReadOrderInfo('full');

    case 'READ_PAYMENT':
      return voiceReadOrderInfo('payment');

    case 'READ_BALANCE':
      return voiceReadOrderInfo('balance');

    case 'READ_DUE_DATE':
      return voiceReadOrderInfo('due');

    case 'READ_TAKEN_BY':
      return voiceReadOrderInfo('takenBy');

    case 'VIEW_CUSTOMER_HISTORY':
      return voiceCustomerHistory(intent.name);

    case 'VIEW_DASHBOARD':
      return voiceDashboard(intent.which);

    default:
      state.voice.status = 'error';
      render();
      speakTelugu('అర్థం కాలేదు. మళ్ళీ చెప్పండి.');
  }
}


/* ---------- READ-ONLY INTENTS ---------- */

function voiceGetLatestOrder() {

  const c = state.customer;

  if (!c || !(c.orders || []).length) {
    return null;
  }

  return c.orders[c.orders.length - 1];
}

function voiceSearchCustomer(name) {

  if (!name) {
    state.voice.status = 'idle';
    render();
    speakTelugu('ఎవరి పేరు చెప్పండి?');
    return;
  }

  const norm = s => String(s || '').toLowerCase().trim();

  const matches = (state.customers || []).filter(
    c => c.name && (norm(c.name).includes(norm(name)) || norm(name).includes(norm(c.name)))
  );

  if (!matches.length) {
    state.voice.status = 'idle';
    render();
    speakTelugu('ఈ పేరుతో కస్టమర్ కనిపించలేదు.');
    return;
  }

  if (matches.length === 1) {

    state.customer = matches[0];
    state.error = '';
    render();

    speakTelugu(`${matches[0].name} గారి వివరాలు తెరిచాను.`);
    return;
  }

  const names = matches.slice(0, 5).map(c => c.name).join(', ');

  state.voice.status = 'idle';
  render();

  speakTelugu(`${matches.length} మంది కస్టమర్లు దొరికారు: ${names}. పూర్తి పేరు చెప్పండి.`);
}

function voiceReadOrderInfo(kind) {

  const c = state.customer;
  const o = voiceGetLatestOrder();

  if (!c) {
    state.voice.status = 'idle';
    render();
    speakTelugu('ముందుగా కస్టమర్‌ని తెరవండి లేదా పేరు చెప్పండి.');
    return;
  }

  if (!o) {
    state.voice.status = 'idle';
    render();
    speakTelugu(`${c.name} గారికి ఇంకా ఆర్డర్‌లు లేవు.`);
    return;
  }

  const total = Number(o.total || 0);
  const paid = Number(o.advancePaid || o.paid || 0);
  const remaining = Math.max(0, total - paid);

  let text;

  if (kind === 'payment') {
    text = `మొత్తం ${numberToTeluguWords(total)} రూపాయలు. ${numberToTeluguWords(paid)} రూపాయలు చెల్లించారు.`;
  } else if (kind === 'balance') {
    text = `ఇంకా ${numberToTeluguWords(remaining)} రూపాయలు తీసుకోవాలి.`;
  } else if (kind === 'due') {
    text = o.dueDate ? `అందించే తేదీ ${o.dueDate}.` : 'అందించే తేదీ నమోదు కాలేదు.';
  } else if (kind === 'takenBy') {
    text = `ఈ ఆర్డర్‌ను ${o.takenBy || 'స్టాఫ్'} తీసుకున్నారు.`;
  } else {
    text = `మొత్తం ధర ${numberToTeluguWords(total)} రూపాయలు. ${numberToTeluguWords(paid)} చెల్లించారు. ఇంకా ${numberToTeluguWords(remaining)} తీసుకోవాలి. స్థితి: ${statusLabel(o.status)}.`;
  }

  speakTelugu(text);
}

function voiceCustomerHistory(name) {

  let c = state.customer;

  if (name) {

    const norm = s => String(s || '').toLowerCase();

    const matches = (state.customers || []).filter(
      x => x.name && norm(x.name).includes(norm(name))
    );

    if (matches.length === 1) {
      c = matches[0];
    }
  }

  if (!c) {
    state.voice.status = 'idle';
    render();
    speakTelugu('ముందుగా కస్టమర్‌ని తెరవండి లేదా పేరు చెప్పండి.');
    return;
  }

  const orders = c.orders || [];

  if (!orders.length) {
    state.voice.status = 'idle';
    render();
    speakTelugu(`${c.name} గారికి ఇంకా ఆర్డర్‌లు లేవు.`);
    return;
  }

  const pending = orders.filter(o => o.status !== 'delivered').length;

  speakTelugu(`${c.name} గారు మొత్తం ${numberToTeluguWords(orders.length)} ఆర్డర్‌లు ఇచ్చారు. ${numberToTeluguWords(pending)} ఇంకా పూర్తి కావాల్సి ఉంది.`);
}

function voiceDashboard(which) {

  const allOrders = [];

  (state.customers || []).forEach(
    c => (c.orders || []).forEach(o => allOrders.push(o))
  );

  const todayStr = iso().slice(0, 10);

  if (which === 'pending_orders') {

    const n = allOrders.filter(o => o.status === 'pending' || o.status === 'in_progress').length;

    speakTelugu(`పెండింగ్ ఆర్డర్‌లు ${numberToTeluguWords(n)}.`);
    return;
  }

  if (which === 'today_deliveries') {

    const n = allOrders.filter(o => String(o.dueDate || '').slice(0, 10) === todayStr).length;

    speakTelugu(`ఈరోజు డెలివరీలు ${numberToTeluguWords(n)}.`);
    return;
  }

  const n = allOrders.filter(o => String(o.createdAt || '').slice(0, 10) === todayStr).length;

  speakTelugu(`ఈరోజు ఆర్డర్‌లు ${numberToTeluguWords(n)}.`);
}

async function voiceUpdateOrderStatus(status) {

  const c = state.customer;
  const o = voiceGetLatestOrder();

  if (!c || !o) {
    state.voice.status = 'idle';
    render();
    speakTelugu('ముందుగా కస్టమర్ మరియు ఆర్డర్‌ని తెరవండి.');
    return;
  }

  if (o.status === status) {
    state.voice.status = 'idle';
    render();
    speakTelugu(`ఈ ఆర్డర్ ఇప్పటికే ${statusLabel(status)}గా ఉంది.`);
    return;
  }

  state.voice.flow = {
    type: 'confirm_status',
    step: 'confirm',
    data: { status }
  };

  askVoiceQuestion(`ఈ ఆర్డర్‌ను ${statusLabel(status)} అని మార్చనా?`);
}


/* ---------- CONVERSATIONAL FLOWS ---------- */

function askVoiceQuestion(question) {

  speakTelugu(question, () => {
    startVoiceRecognition();
  });
}

function cancelVoiceFlow(message) {

  state.voice.flow = null;
  render();

  speakTelugu(message || 'రద్దు చేసాను.');
}

function startVoiceFlow(type, initial = {}) {

  state.voice.flow = {
    type,
    step: null,
    data: { ...initial }
  };

  advanceVoiceFlow(null);
}

async function advanceVoiceFlow(userText) {

  const flow = state.voice.flow;

  if (!flow) {
    return;
  }

  if (flow.type === 'add_customer') {
    return advanceAddCustomerFlow(userText);
  }

  if (flow.type === 'create_order') {
    return advanceCreateOrderFlow(userText);
  }

  if (flow.type === 'confirm_status') {
    return advanceConfirmStatusFlow(userText);
  }

  if (flow.type === 'quick_search') {
    state.voice.flow = null;
    return voiceSearchCustomer(String(userText || '').trim());
  }
}

function advanceConfirmStatusFlow(userText) {

  const flow = state.voice.flow;

  if (isAffirmative(userText)) {
    finalizeStatusUpdate(flow.data.status);
  } else {
    cancelVoiceFlow('సరే, మార్చలేదు.');
  }
}

async function finalizeStatusUpdate(status) {

  const o = voiceGetLatestOrder();

  if (!o) {
    state.voice.flow = null;
    render();
    speakTelugu('ఆర్డర్ కనిపించలేదు.');
    return;
  }

  o.status = status;

  try {

    await saveCustomer(state.customer);

    state.voice.flow = null;
    render();

    speakTelugu(`${statusLabel(status)}.`);

  } catch (e) {

    state.voice.flow = null;
    render();

    speakTelugu('మార్చడంలో పొరపాటు వచ్చింది.');
  }
}

function advanceAddCustomerFlow(userText) {

  const flow = state.voice.flow;
  const d = flow.data;

  if (flow.step === null) {
    flow.step = 'name';
    askVoiceQuestion('కస్టమర్ పేరు చెప్పండి.');
    return;
  }

  if (flow.step === 'name') {

    const name = String(userText || '').trim();

    if (!name) {
      askVoiceQuestion('పేరు వినిపించలేదు. మళ్ళీ చెప్పండి.');
      return;
    }

    d.name = name;
    flow.step = 'phone';

    askVoiceQuestion(`${name}. ఫోన్ నంబర్ చెప్పండి.`);
    return;
  }

  if (flow.step === 'phone') {

    const phone = normalizePhoneNumber(userText);

    if (!phone) {
      askVoiceQuestion('ఫోన్ నంబర్ సరిగ్గా అర్థం కాలేదు. 10 అంకెలు చెప్పండి.');
      return;
    }

    d.phone = phone;
    flow.step = 'address';

    askVoiceQuestion('చిరునామా చెప్పండి. అవసరం లేకపోతే వద్దు అనండి.');
    return;
  }

  if (flow.step === 'address') {

    const t = String(userText || '').trim();

    if (!isNegative(t)) {
      d.address = t;
    }

    flow.step = 'confirm';

    askVoiceQuestion(`కస్టమర్ పేరు ${d.name}. ఫోన్ నంబర్ ${d.phone}. సేవ్ చేయనా?`);
    return;
  }

  if (flow.step === 'confirm') {

    if (isAffirmative(userText)) {
      finalizeAddCustomer(d);
    } else {
      cancelVoiceFlow('సరే, రద్దు చేసాను.');
    }

    return;
  }
}

async function finalizeAddCustomer(d) {

  const existing = (state.customers || []).find(c => c.phone === d.phone);

  const customer = {
    id: (existing && existing.id) || makeCustomerId(),
    name: d.name,
    phone: d.phone,
    address: d.address || '',
    notes: '',
    orders: (existing && existing.orders) || []
  };

  try {

    await saveCustomer(customer);

    state.customer = customer;
    state.voice.flow = null;
    state.error = '';
    render();

    speakTelugu('కస్టమర్ విజయవంతంగా సేవ్ అయింది.');

  } catch (e) {

    state.voice.flow = null;
    render();

    speakTelugu('కస్టమర్‌ని సేవ్ చేయడంలో పొరపాటు వచ్చింది.');
  }
}

function extractGarmentCounts(text) {

  const t = String(text || '');

  let shirt = 0;
  let pant = 0;

  const shirtMatch = t.match(/([\u0C00-\u0C7Fa-zA-Z0-9]+)\s*(షర్ట్|shirt)/i);
  const pantMatch = t.match(/([\u0C00-\u0C7Fa-zA-Z0-9]+)\s*(ప్యాంట్|pant)/i);

  if (shirtMatch) {
    shirt = parseSpokenAmount(shirtMatch[1]) ?? 1;
  } else if (/షర్ట్|shirt/i.test(t)) {
    shirt = 1;
  }

  if (pantMatch) {
    pant = parseSpokenAmount(pantMatch[1]) ?? 1;
  } else if (/ప్యాంట్|pant/i.test(t)) {
    pant = 1;
  }

  return { shirt, pant };
}

function advanceCreateOrderFlow(userText) {

  const flow = state.voice.flow;
  const d = flow.data;

  if (flow.step === null) {

    if (state.customer) {

      d.customer = state.customer;
      flow.step = 'garments';

      askVoiceQuestion(`${d.customer.name} గారికి ఆర్డర్. ఎన్ని షర్ట్‌లు, ఎన్ని ప్యాంట్‌లు కావాలి?`);
      return;
    }

    if (d.name) {

      const norm = s => String(s || '').toLowerCase();

      const matches = (state.customers || []).filter(
        c => c.name && norm(c.name).includes(norm(d.name))
      );

      if (matches.length === 1) {

        d.customer = matches[0];
        state.customer = matches[0];
        flow.step = 'garments';

        askVoiceQuestion(`${d.customer.name} గారికి ఆర్డర్. ఎన్ని షర్ట్‌లు, ఎన్ని ప్యాంట్‌లు కావాలి?`);
        return;
      }
    }

    flow.step = 'customer_name';
    askVoiceQuestion('ఏ కస్టమర్ కోసం ఆర్డర్? పేరు చెప్పండి.');
    return;
  }

  if (flow.step === 'customer_name') {

    const name = String(userText || '').trim();
    const norm = s => String(s || '').toLowerCase();

    const matches = (state.customers || []).filter(
      c => c.name && (norm(c.name).includes(norm(name)) || norm(name).includes(norm(c.name)))
    );

    if (!matches.length) {
      askVoiceQuestion('ఈ పేరుతో కస్టమర్ కనిపించలేదు. మళ్ళీ చెప్పండి, లేదా ముందుగా కొత్త కస్టమర్‌ని జోడించండి.');
      return;
    }

    if (matches.length > 1) {
      askVoiceQuestion(`ఒకటి కంటే ఎక్కువ మంది దొరికారు: ${matches.slice(0, 3).map(c => c.name).join(', ')}. పూర్తి పేరు చెప్పండి.`);
      return;
    }

    d.customer = matches[0];
    state.customer = matches[0];
    flow.step = 'garments';

    askVoiceQuestion(`${d.customer.name} గారికి ఆర్డర్. ఎన్ని షర్ట్‌లు, ఎన్ని ప్యాంట్‌లు కావాలి?`);
    return;
  }

  if (flow.step === 'garments') {

    const counts = extractGarmentCounts(userText);

    if (!counts.shirt && !counts.pant) {
      askVoiceQuestion('కనీసం ఒక షర్ట్ లేదా ప్యాంట్ సంఖ్య చెప్పండి.');
      return;
    }

    d.shirt = counts.shirt;
    d.pant = counts.pant;
    flow.step = 'total';

    askVoiceQuestion('మొత్తం ధర ఎంత?');
    return;
  }

  if (flow.step === 'total') {

    const amt = parseSpokenAmount(userText);

    if (amt === null) {
      askVoiceQuestion('మొత్తం ధర సరిగ్గా అర్థం కాలేదు. మళ్ళీ చెప్పండి.');
      return;
    }

    d.total = amt;
    flow.step = 'paid';

    askVoiceQuestion(`${numberToTeluguWords(amt)} రూపాయలు. ఎంత అడ్వాన్స్ చెల్లించారు?`);
    return;
  }

  if (flow.step === 'paid') {

    let amt;

    if (isNegative(userText) || /సున్నా|zero/i.test(userText)) {
      amt = 0;
    } else {
      amt = parseSpokenAmount(userText);
    }

    if (amt === null || amt === undefined) {
      askVoiceQuestion('చెల్లించిన మొత్తం అర్థం కాలేదు. మళ్ళీ చెప్పండి.');
      return;
    }

    if (amt > d.total) {
      askVoiceQuestion('చెల్లించిన మొత్తం, మొత్తం ధర కంటే ఎక్కువగా ఉంది. మళ్ళీ చెప్పండి.');
      return;
    }

    d.paid = amt;
    flow.step = 'due';

    askVoiceQuestion('ఎప్పుడు ఇవ్వాలి?');
    return;
  }

  if (flow.step === 'due') {

    const date = parseSpokenDate(userText);

    if (!date) {
      askVoiceQuestion('తేదీ అర్థం కాలేదు. "రేపు" లేదా తేదీ చెప్పండి.');
      return;
    }

    d.due = date;
    flow.step = 'notes';

    askVoiceQuestion('ఏమైనా నోట్స్ ఉన్నాయా? లేకపోతే వద్దు అనండి.');
    return;
  }

  if (flow.step === 'notes') {

    if (!isNegative(userText)) {
      d.notes = String(userText || '').trim();
    }

    flow.step = 'confirm';

    const garmentText = [
      d.shirt ? `${d.shirt} షర్ట్` : '',
      d.pant ? `${d.pant} ప్యాంట్` : ''
    ].filter(Boolean).join(', ');

    askVoiceQuestion(`${garmentText}. మొత్తం ${numberToTeluguWords(d.total)} రూపాయలు. ${numberToTeluguWords(d.paid)} చెల్లించారు. సేవ్ చేయనా?`);
    return;
  }

  if (flow.step === 'confirm') {

    if (isAffirmative(userText)) {
      finalizeCreateOrder(d);
    } else {
      cancelVoiceFlow('సరే, ఆర్డర్ రద్దు చేసాను.');
    }

    return;
  }
}

async function finalizeCreateOrder(d) {

  const c = d.customer;

  c.orders = c.orders || [];

  const newOrder = {
    id: 'ORD-' + Date.now().toString().slice(-6),
    createdAt: iso(),
    type: (d.shirt && !d.pant) ? 'shirt' : ((d.pant && !d.shirt) ? 'pant' : 'shirt and pant'),
    quantity: (d.shirt || 0) + (d.pant || 0),
    garments: { shirt: d.shirt || 0, pant: d.pant || 0 },
    takenBy: state.user?.name || state.user?.username || 'Staff',
    dueDate: d.due || '',
    status: 'pending',
    total: d.total || 0,
    advancePaid: d.paid || 0,
    paid: d.paid || 0,
    measurements: '',
    notes: d.notes || '',
    photos: []
  };

  c.orders.push(newOrder);

  try {

    await saveCustomer(c);

    state.customer = c;
    state.voice.flow = null;
    render();

    speakTelugu('ఆర్డర్ విజయవంతంగా సేవ్ అయింది.');

  } catch (e) {

    state.voice.flow = null;
    render();

    speakTelugu('ఆర్డర్‌ని సేవ్ చేయడంలో పొరపాటు వచ్చింది.');
  }
}


/* ---------- SHORTCUT DISPATCH ---------- */

function runVoiceShortcut(name) {

  if (name === 'add_customer') {
    return startVoiceFlow('add_customer');
  }

  if (name === 'create_order') {

  }

    return askVoiceQuestion('ఎవరి పేరు చెప్పండి?');
  }

  if (name === 'pending_orders') {
    return voiceDashboard('pending_orders');
  }

  if (name === 'today_deliveries') {
    return voiceDashboard('today_deliveries');
  }
}


/* =========================
   CUSTOMER ID
========================= */

function makeCustomerId() {

  const ids =
    (state.customers || [])
      .map(
        c =>
          Number(
            String(c.id || '')
              .replace(/\D/g, '')
          )
      )
      .filter(
        n => !Number.isNaN(n)
      );

  const next =
    ids.length
      ? Math.max(...ids) + 1
      : 1001;

  return `GT-${next}`;
}


/* =========================
   SAVE CUSTOMER
========================= */

async function saveCustomer(c) {

  const clean = {
    ...c
  };

  if (!clean.id) {
    clean.id =
      makeCustomerId();
  }

  const all =
    await get(KEY.customers) ||
    [];

  const idx =
    all.findIndex(
      item =>
        item &&
        item.phone === clean.phone
    );

  if (idx >= 0) {

    all[idx] = clean;

  } else {

    all.push(clean);

  }

  state.customers = all;

  await set(
    KEY.customers,
    all
  );

  await set(
    'customer:' + clean.phone,
    clean
  );
}


/* =========================
   LOAD CUSTOMER
========================= */

async function loadCustomer(p) {

  const all =
    await get(KEY.customers) ||
    [];

  const normalized =
    String(p)
      .replace(/\D/g, '');

  const fromList =
    all.find(
      c =>
        String(c.phone || '')
          .replace(/\D/g, '') ===
        normalized
    );

  if (fromList) {
    return fromList;
  }

  const byPhone =
    await get(
      'customer:' + normalized
    );

  return (
    byPhone &&
    String(byPhone.phone || '')
      .replace(/\D/g, '') ===
      normalized
  )
    ? byPhone
    : null;
}

            render();

          }

        };

    });


  /* ---------- NEW ORDER ---------- */

  document
    .getElementById('newOrder')
    ?.addEventListener(
      'click',
      () => {

        state.modal =
          'order';

        state.tempOrderPhotos =
          [];

        render();

      }
    );


  /* ---------- CANCEL ORDER ---------- */

  document
    .getElementById('cancelOrder')
    ?.addEventListener(
      'click',
      () => {

        state.modal =
          false;

        state.tempOrderPhotos =
          [];

        render();

      }
    );


  /* ---------- SAVE ORDER ---------- */

  document
    .getElementById('saveOrder')
    ?.addEventListener(
      'click',
      saveOrder
    );


  /* ---------- UPDATE STATUS ---------- */

  document
    .querySelectorAll('[data-save-status]')
    .forEach(b => {

      b.onclick =
        async () => {

          const order =
            state.customer.orders.find(
              x =>
                x.id ===
                b.dataset.saveStatus
            );

          if (!order) {
            return;
          }

          order.status =
            document
              .querySelector(
                `[data-status="${order.id}"]`
              )
              .value;

          await saveCustomer(
            state.customer
          );

          render();

        };

    });


  /* ---------- BACK ---------- */

  document
    .getElementById('back')
    ?.addEventListener(
      'click',
      () => {

        if (
          state.screen ===
          'customer'
        ) {

          state.screen =
            'login';

          state.phone =
            null;

        } else {

          state.customer =
            null;

        }

        state.error =
          '';

        render();

      }
    );


  /* ---------- DELETE ORDER PHOTO ---------- */

  document
    .querySelectorAll(
      '[data-delete-order-photo]'
    )
    .forEach(btn => {

      btn.onclick =
        async () => {

          const orderId =
            btn.dataset.orderId;

          const photoIndex =
            Number(
              btn.dataset
                .deleteOrderPhoto
            );

          const order =
            state.customer.orders.find(
              o =>
                o.id === orderId
            );

          if (!order) {
            return;
          }

          order.photos.splice(
            photoIndex,
            1
          );

          await saveCustomer(
            state.customer
          );

          render();

        };

    });


  /* ---------- PHOTOS ---------- */

  document
    .getElementById('photos')
    ?.addEventListener(
      'change',
      handlePhotoSelection
    );

  document
    .getElementById('customerPhotos')
    ?.addEventListener(
      'change',
      handlePhotoSelection
    );


  renderTempPhotos();

  bindTempPhotoDeletes();

}


/* =========================
   SAVE ORDER
========================= */

async function saveOrder() {

  if (!state.customer) {

    state.error =
      'Select a customer first.';

    render();

    return;
  }


  const total =
    Number(
      document
        .getElementById('total')
        .value
    ) || 0;


  const paid =
    Number(
      document
        .getElementById('paid')
        .value
    ) || 0;


  if (total < paid) {

    alert(
      'Advance paid cannot exceed total amount.'
    );

    return;
  }


  const shirtQuantity =
    Math.max(
      0,
      Number(
        document
          .getElementById(
            'shirtQuantity'
          )
          .value
      ) || 0
    );


  const pantQuantity =
    Math.max(
      0,
      Number(
        document
          .getElementById(
            'pantQuantity'
          )
          .value
      ) || 0
    );


  if (
    !shirtQuantity &&
    !pantQuantity
  ) {

    alert(
      'Enter at least one shirt or pant.'
    );

    return;
  }


  const due =
    document
      .getElementById('due')
      .value;


  const measurements =
    document
      .getElementById('measure')
      .value
      .trim();


  const notes =
    document
      .getElementById('notes')
      .value
      .trim();


  state.customer.orders =
    state.customer.orders ||
    [];


  state.customer.orders.push({

    id:
      'ORD-' +
      Date.now()
        .toString()
        .slice(-6),

    createdAt:
      iso(),

    type:
      shirtQuantity &&
      !pantQuantity
        ? 'shirt'
        : pantQuantity &&
          !shirtQuantity
          ? 'pant'
          : 'shirt and pant',

    quantity:
      shirtQuantity +
      pantQuantity,

    garments: {
      shirt: shirtQuantity,
      pant: pantQuantity
    },

    takenBy:
      state.user?.name ||
      state.user?.username ||
      'Staff',

    dueDate:
      due,

    status:
      'pending',

    total:
      total,

    advancePaid:
      paid,

    paid:
      paid,

    measurements:
      measurements,

    notes:
      notes,

    photos:
      [
        ...state.tempOrderPhotos.map(
          p => p.src
        )
      ]

  });


  await saveCustomer(
    state.customer
  );


  state.modal =
    false;

  state.tempOrderPhotos =
    [];

  render();

}


/* =========================
   INITIALIZE
========================= */

async function init() {

  try {

    state.staff =
      await get(KEY.staff);


    if (
      !state.staff ||
      !state.staff.length
    ) {

      /*
       * This is only a fallback.
       * Normally the Supabase staff table
       * already contains the admin account.
       */

      state.staff = [
        {
          id: 'admin1',
          username: 'admin',
          name: 'Admin',
          isAdmin: true
        }
      ];

    }


    state.customers =
      await get(
        KEY.customers
      ) || [];


    state.screen =
      'login';


    state.error =
      '';


    render();

  } catch (err) {

    console.error(
      'Initialization error:',
      err
    );

    state.screen =
      'login';

    state.error =
      'Unable to connect to the server. Please refresh and try again.';

    render();

  }

}


init();

</script>
